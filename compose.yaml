services:
  dazzled:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      LISTEN_ADDR: :8080
      DATABASE_PATH: /data/dazzled.db
      WEB_DIR: /app/web
    volumes:
      - dazzled-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

volumes:
  dazzled-data:
